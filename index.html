<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>感情円環ピッカー (iPad版)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="circumplex"></canvas>
  
  <div class="controls">
    <div class="label-mode-selector">
      <label><input type="radio" name="labelMode" value="normal" checked> 通常モード (16)</label>
      <label><input type="radio" name="labelMode" value="simple"> 簡易モード (4)</label>
    </div>
    <div class="mode-selector">
      <label><input type="radio" name="mode" value="free" checked> Free</label>
      <label><input type="radio" name="mode" value="circle"> Circle</label>
      <label><input type="radio" name="mode" value="labels"> Labels</label>
    </div>
    <button class="control-btn" id="undo">元に戻す</button>
    <button class="control-btn" id="clear">クリア</button>
    <button class="control-btn" id="saveCsv">CSV保存</button>
  </div>
  
  <div class="info-overlay" id="info">
    履歴: 0 点<br>
    Mode: free
  </div>
  
  <div class="status-overlay" id="status">タップ/ドラッグで点を追加</div>

  <script src="app.js"></script>
</body>
</html>
