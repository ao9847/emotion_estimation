<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>感情円環ピッカー (iPad版)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ラッセルの感情円環（Valence × Arousal）</h1>
  </header>
  <main>
    <section class="plot-panel">
      <canvas id="circumplex" width="900" height="900" aria-label="Valence×Arousal 円環"></canvas>
    </section>
    <section class="side-panel">
      <div class="group">
        <div class="label">スナップモード</div>
        <label><input type="radio" name="mode" value="free" checked> free（任意点）</label>
        <label><input type="radio" name="mode" value="circle"> circle（円周）</label>
        <label><input type="radio" name="mode" value="labels"> labels（最寄りラベル）</label>
      </div>
      <div class="group">
        <div id="count">履歴: 0 点</div>
        <div id="readout" class="readout">Valence(x): -\nArousal(y): -\nAngle(°): -\nSnap mode: free\nChosen lbl: -\nNearest lbl: -</div>
      </div>
      <div class="group buttons">
        <button id="undo">最後を取り消し (Undo)</button>
        <button id="clear">履歴をクリア</button>
        <button id="saveCsv">CSVに保存</button>
        <button id="quit">終了</button>
      </div>
      <div id="status" class="status">タップ/ドラッグで点を追加できます。</div>
    </section>
  </main>
  <footer>
    <small>iPad Safari向け: Canvas + JavaScriptで実装。日本語フォントは端末のものを利用します。</small>
  </footer>
  <script src="app.js"></script>
</body>
</html>
