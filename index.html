<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>感情円環ピッカー (iPad版)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { 
      height: 100%; 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body { 
      background: #fafbff;
      position: relative;
    }
    #circumplex { 
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    /* フローティングコントロール */
    .controls {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
      pointer-events: auto;
    }
    
    .control-btn {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #bfc7d5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #2b3148;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      min-width: 120px;
      text-align: center;
      pointer-events: auto;
    }
    
    .control-btn:active {
      background: rgba(238, 242, 255, 0.95);
    }
    
    .mode-selector {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #bfc7d5;
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      pointer-events: auto;
    }
    
    .mode-selector label {
      display: block;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
      pointer-events: auto;
    }
    
    .mode-selector input {
      margin-right: 6px;
      pointer-events: auto;
    }
    
    /* ステータス表示 */
    .status-overlay {
      position: fixed;
      bottom: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #c8cfde;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #566cd6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 300px;
      z-index: 100;
      pointer-events: none;
    }
    
    .info-overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #c8cfde;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: #2b3148;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 100;
      line-height: 1.6;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="circumplex"></canvas>
  
  <div class="controls">
    <div class="mode-selector">
      <label><input type="radio" name="mode" value="free" checked> Free</label>
      <label><input type="radio" name="mode" value="circle"> Circle</label>
      <label><input type="radio" name="mode" value="labels"> Labels</label>
    </div>
    <button class="control-btn" id="undo">元に戻す</button>
    <button class="control-btn" id="clear">クリア</button>
    <button class="control-btn" id="saveCsv">CSV保存</button>
  </div>
  
  <div class="info-overlay" id="info">
    履歴: 0 点<br>
    Mode: free
  </div>
  
  <div class="status-overlay" id="status">タップ/ドラッグで点を追加</div>

  <script>
(function(){
  const canvas = document.getElementById('circumplex');
  const ctx = canvas.getContext('2d');
  
  // キャンバスをウィンドウサイズに合わせる
  function resizeCanvas(){
    const ratio = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * ratio;
    canvas.height = window.innerHeight * ratio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    
    // 中心と半径を再計算
    center.x = window.innerWidth / 2;
    center.y = window.innerHeight / 2;
    R = Math.min(center.x, center.y) - 60;
    
    drawAll();
  }
  
  let center = { x: 0, y: 0 };
  let R = 0;
  const rPoint = 0.92;
  const rText = 1.08;

  const emotions = [
    ["警戒", 75],["興奮",45],["有頂天",25],["幸福",10],
    ["満足",-15],["リラックス",-35],["穏やか",-60],["眠い",-90],
    ["退屈",-120],["抑うつ",-140],["悲しみ",-160],["不快",180],
    ["いら立ち",160],["怒り",140],["緊張",120],["不安",100]
  ];

  let snapMode = 'free';
  let dragging = false;
  let lastLogTime = null;
  const logEveryMs = 40;
  let selected = null;
  const history = [];
  const trail = [];

  const statusEl = document.getElementById('status');
  const infoEl = document.getElementById('info');

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  document.querySelectorAll('input[name="mode"]').forEach(r => {
    r.addEventListener('change', () => {
      snapMode = r.value;
      updateInfo();
      statusEl.textContent = `モード: ${snapMode}`;
      drawAll();
    });
  });
  
  document.getElementById('undo').addEventListener('click', onUndo);
  document.getElementById('clear').addEventListener('click', onClear);
  document.getElementById('saveCsv').addEventListener('click', onSaveCsv);

  function normToPx(x,y){ return { x: center.x + x*R, y: center.y - y*R }; }
  function pxToNorm(px,py){ return { x: (px - center.x)/R, y: -(py - center.y)/R }; }
  function angleDeg(x,y){ return Math.atan2(y, x) * 180/Math.PI; }
  
  function nearestLabel(angle){
    function dist(a,b){ let d = Math.abs(a-b)%360; return Math.min(d, 360-d); }
    let best = emotions[0], bestD = Infinity;
    for(const e of emotions){ const d = dist(angle, e[1]); if(d < bestD){ bestD = d; best = e; } }
    return best;
  }

  function applySnap(x,y){
    let chosen = null;
    if(snapMode === 'circle'){
      const r = Math.hypot(x,y);
      if(r === 0){ x = 1.0; y = 0.0; } else { x /= r; y /= r; }
    } else if(snapMode === 'labels'){
      const ang = angleDeg(x,y);
      const [name, deg] = nearestLabel(ang);
      const th = deg * Math.PI/180;
      x = rPoint * Math.cos(th);
      y = rPoint * Math.sin(th);
      chosen = name;
    } else {
      const r = Math.hypot(x,y);
      if(r > 1.0){ x/=r; y/=r; }
    }
    return {x,y,chosen_label: chosen};
  }

  function logAndDraw(x,y,chosen_label=null,phase='click'){
    const ang = angleDeg(x,y);
    const [nearestName] = nearestLabel(ang);
    selected = {
      timestamp: new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }),
      valence: x, arousal: y, angle_deg: ang,
      label: chosen_label || nearestName, chosen_label,
      snap_mode: snapMode, phase
    };
    history.push({...selected});
    trail.push({x,y});
    if(phase === 'release'){ trail.push({x: NaN, y: NaN}); }
    updateInfo();
    drawAll();
  }

  function updateInfo(){
    infoEl.innerHTML = `履歴: ${history.length} 点<br>Mode: ${snapMode}`;
  }

  function drawAll(){
    const w = window.innerWidth;
    const h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    ctx.save();
    ctx.translate(center.x, center.y);
    
    // 背景円
    ctx.beginPath(); 
    ctx.arc(0,0,R,0,Math.PI*2);
    ctx.fillStyle = '#f8f9fb'; 
    ctx.fill();
    ctx.lineWidth = 2; 
    ctx.strokeStyle = '#bfc7d5'; 
    ctx.stroke();

    // 軸線
    ctx.lineWidth = 1.5; 
    ctx.strokeStyle = '#9aa4b2';
    ctx.beginPath(); 
    ctx.moveTo(-R,0); 
    ctx.lineTo(R,0); 
    ctx.stroke();
    ctx.beginPath(); 
    ctx.moveTo(0,-R); 
    ctx.lineTo(0,R); 
    ctx.stroke();

    // 補助リング
    for(const r of [0.5,0.75]){
      ctx.beginPath(); 
      ctx.arc(0,0,R*r,0,Math.PI*2);
      ctx.lineWidth = 1; 
      ctx.strokeStyle = '#e3e7ef'; 
      ctx.stroke();
    }

    // ラベル
    const fontSize = Math.max(12, Math.min(16, R / 20));
    ctx.font = `${fontSize}px -apple-system, Hiragino Sans, Yu Gothic, Meiryo, sans-serif`;
    ctx.fillStyle = '#2b3148';
    
    for(const [label, deg] of emotions){
      const th = deg * Math.PI/180;
      const x = R * rPoint * Math.cos(th);
      const y = - R * rPoint * Math.sin(th);
      
      // 点
      ctx.beginPath(); 
      ctx.arc(x,y,6,0,Math.PI*2); 
      ctx.fillStyle = '#566cd6'; 
      ctx.fill();
      
      // テキスト
      const tx = R * rText * Math.cos(th);
      const ty = - R * rText * Math.sin(th);
      ctx.fillStyle = '#2b3148';
      const ha = Math.cos(th) >= 0 ? 'left' : 'right';
      const va = Math.sin(th) >= 0 ? 'top' : 'bottom';
      ctx.textAlign = ha; 
      ctx.textBaseline = va;
      ctx.fillText(label, tx, ty);
      
      // 接続線
      ctx.strokeStyle = '#c8cfde'; 
      ctx.lineWidth = 1;
      ctx.beginPath(); 
      ctx.moveTo(x,y); 
      ctx.lineTo(tx,ty); 
      ctx.stroke();
    }
    ctx.restore();

    // トレイル
    ctx.save();
    ctx.lineWidth = 2; 
    ctx.strokeStyle = '#e4572e'; 
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    let started = false;
    for(const p of trail){
      if(Number.isNaN(p.x) || Number.isNaN(p.y)){ 
        started = false; 
        continue; 
      }
      const {x,y} = normToPx(p.x, p.y);
      if(!started){ 
        ctx.moveTo(x,y); 
        started = true; 
      } else { 
        ctx.lineTo(x,y); 
      }
    }
    ctx.stroke();
    ctx.restore();

    // 選択点
    if(selected){
      const {x,y} = normToPx(selected.valence, selected.arousal);
      ctx.beginPath(); 
      ctx.arc(x,y,12,0,Math.PI*2);
      ctx.lineWidth = 2; 
      ctx.strokeStyle = '#e4572e'; 
      ctx.stroke();
      ctx.beginPath(); 
      ctx.arc(x,y,8,0,Math.PI*2);
      ctx.fillStyle = '#e4572e'; 
      ctx.fill();
    }
  }

  function getCanvasPos(evt){
    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;
    if(evt.touches && evt.touches.length){ 
      clientX = evt.touches[0].clientX; 
      clientY = evt.touches[0].clientY; 
    } else { 
      clientX = evt.clientX; 
      clientY = evt.clientY; 
    }
    // CSSピクセル単位での座標を返す
    return { 
      x: clientX - rect.left, 
      y: clientY - rect.top 
    };
  }

  function onPress(evt){
    evt.preventDefault();
    const p = getCanvasPos(evt);
    const n = pxToNorm(p.x, p.y);
    const {x,y,chosen_label} = applySnap(n.x, n.y);
    dragging = true; 
    lastLogTime = performance.now();
    logAndDraw(x,y,chosen_label,'press');
  }
  
  function onMove(evt){
    if(!dragging) return; 
    evt.preventDefault();
    const p = getCanvasPos(evt);
    const n = pxToNorm(p.x, p.y);
    const {x,y,chosen_label} = applySnap(n.x, n.y);
    const now = performance.now();
    if(!lastLogTime || (now - lastLogTime) >= logEveryMs){
      lastLogTime = now; 
      logAndDraw(x,y,chosen_label,'move');
    } else {
      selected = { 
        timestamp: new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }),
        valence: x, arousal: y, angle_deg: angleDeg(x,y),
        label: (chosen_label || nearestLabel(angleDeg(x,y))[0]), chosen_label,
        snap_mode: snapMode, phase: 'move' 
      };
      drawAll();
    }
  }
  
  function onRelease(evt){
    if(!dragging) return; 
    evt.preventDefault();
    const p = getCanvasPos(evt);
    const n = pxToNorm(p.x, p.y);
    const {x,y,chosen_label} = applySnap(n.x, n.y);
    logAndDraw(x,y,chosen_label,'release');
    dragging = false; 
    lastLogTime = null;
  }

  canvas.addEventListener('mousedown', onPress);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onRelease);
  canvas.addEventListener('touchstart', onPress, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onRelease, { passive: false });
  canvas.addEventListener('touchcancel', onRelease, { passive: false });
  
  // コンテキストメニューを無効化
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  function onUndo(){
    if(history.length === 0) return;
    history.pop();
    trail.length = 0;
    for(const row of history){
      trail.push({x: row.valence, y: row.arousal});
      if(row.phase === 'release') trail.push({x: NaN, y: NaN});
    }
    selected = history.length ? history[history.length-1] : null;
    updateInfo();
    drawAll();
    statusEl.textContent = '最後の点を取り消しました';
  }
  
  function onClear(){
    if(history.length === 0) return;
    if(!confirm('履歴をすべて削除しますか？')) return;
    history.length = 0; 
    trail.length = 0; 
    selected = null;
    updateInfo();
    drawAll();
    statusEl.textContent = '履歴をクリアしました';
  }
  
  function onSaveCsv(){
    if(history.length === 0){ 
      alert('保存する履歴がありません'); 
      return; 
    }
    const header = ['index','timestamp','phase','valence','arousal','angle_deg','label','snap_mode'];
    const lines = [header.join(',')];
    history.forEach((row,i) => {
      lines.push([
        i+1,
        row.timestamp,
        row.phase || '',
        row.valence.toFixed(6),
        row.arousal.toFixed(6),
        row.angle_deg.toFixed(6),
        row.label,
        row.snap_mode
      ].join(','));
    });
    const blob = new Blob([lines.join('\n')+'\n'], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const fname = `circumplex_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.csv`;
    a.href = url; 
    a.download = fname; 
    document.body.appendChild(a); 
    a.click();
    URL.revokeObjectURL(url); 
    a.remove();
    statusEl.textContent = `CSVを保存: ${fname}`;
  }

  updateInfo();
  drawAll();
})();
  </script>
</body>
</html>
